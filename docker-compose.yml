version: '3.8'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16-alpine
    container_name: fanpage-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-wfnb}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dev_password}
      POSTGRES_DB: ${DATABASE_NAME:-fanpage}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-wfnb} -d ${DATABASE_NAME:-fanpage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wangfeng-network

  # FastAPI 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wangfeng-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 数据库配置
      DATABASE_ENGINE: ${DATABASE_ENGINE:-postgresql+psycopg}
      DATABASE_USER: ${DATABASE_USER:-wfnb}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dev_password}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-fanpage}

      # 应用配置
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this}
      DEBUG: ${DEBUG:-false}

      # OSS/S3 配置（可选）
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
    ports:
      - "1994:1994"
    volumes:
      # 挂载音乐文件目录（重要：音乐不打包进镜像）
      - ./frontend/public/music:/app/frontend/public/music:ro
      # 挂载其他可能的公共资源
      - ./frontend/public/data:/app/frontend/public/data:ro
      - ./frontend/public/images:/app/frontend/public/images:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1994/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wangfeng-network
    restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: wangfeng-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置文件
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      # SSL 证书（如果有）
      # - ./certs:/etc/nginx/certs:ro
    networks:
      - wangfeng-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  wangfeng-network:
    driver: bridge
